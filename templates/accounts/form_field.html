<div class="form-field{% if field.errors %} has-error{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}
        <p class="form-help" id="{{ field.id_for_label }}_help">{{ field.help_text|safe }}</p>
    {% else %}
        <span id="{{ field.id_for_label }}_help"></span>
    {% endif %}
    <div class="form-error" id="{{ field.id_for_label }}_error" role="alert">
        {% for error in field.errors %}<p>{{ error }}</p>{% endfor %}
    </div>
</div>
