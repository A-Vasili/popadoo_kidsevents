{% load static %}

<header class="site-header">
    <div class="container">
        <nav class="site-navigation" aria-label="Primary navigation" data-i18n-aria-label="nav.primaryLabel">
            <a
                class="site-logo"
                href="{% url 'core:core_home' %}"
                aria-label="Popadoo Kids Events home"
                data-i18n-aria-label="nav.logoLabel"
            >
                <img
                    class="site-logo-mark"
                    src="{% static 'assets/svg/popadoo-logo.svg' %}"
                    alt=""
                    width="128"
                    height="128"
                >
                <span class="site-logo-text">Popadoo Kids Events</span>
            </a>

            <button
                class="site-navigation-toggle"
                type="button"
                aria-controls="primary-navigation"
                aria-expanded="false"
                aria-label="Open primary navigation"
            >
                <span class="site-navigation-toggle-line" aria-hidden="true"></span>
                <span class="site-navigation-toggle-line" aria-hidden="true"></span>
                <span class="site-navigation-toggle-line" aria-hidden="true"></span>
            </button>

            <div class="site-navigation-menu" id="primary-navigation">
                <ul class="site-navigation-links">
                    <li>
                        <a
                            class="site-navigation-link{% if request.resolver_match.url_name == 'core_home' %} active{% endif %}"
                            href="{% url 'core:core_home' %}"
                            {% if request.resolver_match.url_name == 'core_home' %}aria-current="page"{% endif %}
                            data-i18n="nav.home"
                        >Home</a>
                    </li>
                    <li>
                        <a
                            class="site-navigation-link{% if request.resolver_match.url_name == 'core_gallery' %} active{% endif %}"
                            href="{% url 'core:core_gallery' %}"
                            {% if request.resolver_match.url_name == 'core_gallery' %}aria-current="page"{% endif %}
                            data-i18n="nav.gallery"
                        >Gallery</a>
                    </li>
                    <li>
                        <a
                            class="site-navigation-link{% if request.resolver_match.app_name == 'party_builder' %} active{% endif %}"
                            href="{% url 'party_builder:party_builder_package_options' %}"
                            {% if request.resolver_match.app_name == 'party_builder' %}aria-current="page"{% endif %}
                            data-i18n="nav.buildParty"
                        >Build Your Party</a>
                    </li>
                    <li>
                        <a
                            class="site-navigation-link{% if request.resolver_match.url_name == 'core_about' %} active{% endif %}"
                            href="{% url 'core:core_about' %}"
                            {% if request.resolver_match.url_name == 'core_about' %}aria-current="page"{% endif %}
                            data-i18n="nav.about"
                        >About Us</a>
                    </li>
                    <li>
                        <a
                            class="site-navigation-link{% if request.resolver_match.url_name == 'core_testimonials' %} active{% endif %}"
                            href="{% url 'core:core_testimonials' %}"
                            {% if request.resolver_match.url_name == 'core_testimonials' %}aria-current="page"{% endif %}
                            data-i18n="nav.testimonials"
                        >Testimonials</a>
                    </li>
                </ul>

                <div class="site-controls">
                    <div class="language-control">
                        <label class="visually-hidden" for="language-selector" data-i18n="language.label">Language</label>
                        <select
                            class="language-selector"
                            id="language-selector"
                            aria-label="Language"
                            data-i18n-aria-label="language.label"
                        >
                            <option value="en" lang="en" data-i18n="language.english">English</option>
                            <option value="el" lang="el" data-i18n="language.greek">Greek</option>
                        </select>
                    </div>

                    <button
                        class="theme-toggle"
                        id="theme-toggle"
                        type="button"
                        role="switch"
                        aria-checked="false"
                        aria-label="Switch to dark mode"
                    >
                        <span class="theme-toggle-track" aria-hidden="true">
                            <span class="theme-toggle-stars"></span>
                            <span class="theme-toggle-clouds"></span>
                            <span class="theme-toggle-knob">
                                <img class="theme-toggle-icon theme-toggle-icon-moon" src="{% static 'assets/svg/moon-toggle.svg' %}" alt="" width="82" height="82">
                                <img class="theme-toggle-icon theme-toggle-icon-sun" src="{% static 'assets/svg/sun-toggle.svg' %}" alt="" width="82" height="82">
                            </span>
                        </span>
                        <span class="visually-hidden" data-theme-status>Light mode</span>
                    </button>

                    <a
                        class="book-now-button{% if request.resolver_match.app_name == 'party_builder' %} active{% endif %}"
                        href="{% url 'party_builder:party_builder_package_options' %}"
                        data-i18n="nav.bookNow"
                    >Book Now</a>
                </div>
            </div>
        </nav>
    </div>
</header>
