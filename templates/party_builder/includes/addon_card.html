<article class="addon-option{% if addon.is_featured %} addon-option-featured{% endif %}">
    <input
        class="addon-checkbox"
        type="checkbox"
        name="addons"
        value="{{ addon.pk }}"
        id="addon-{{ addon.pk }}"
        data-addon-checkbox
        data-addon-name="{{ addon.name }}"
        data-addon-price="{{ addon.price }}"
        {% if selected %}checked{% endif %}
        aria-describedby="addon-{{ addon.pk }}-description addon-{{ addon.pk }}-price"
    >

    <label class="addon-card" for="addon-{{ addon.pk }}">
        <span class="addon-card-topline">
            <span class="addon-icon" aria-hidden="true">{{ addon.icon }}</span>
            {% if addon.is_featured %}
                <span class="addon-badge">Popular choice</span>
            {% endif %}
        </span>

        <span class="addon-name">{{ addon.name }}</span>
        <span class="addon-description" id="addon-{{ addon.pk }}-description">
            {{ addon.short_description }}
        </span>

        <span class="addon-meta">
            <span class="addon-price" id="addon-{{ addon.pk }}-price">
                +€{{ addon.price|floatformat:2 }}
            </span>
            {% if addon.duration_minutes %}
                <span class="addon-duration">+{{ addon.duration_minutes }} minutes</span>
            {% else %}
                <span class="addon-duration">Runs within party time</span>
            {% endif %}
        </span>

        <span class="addon-action" data-addon-action>
            {% if selected %}Added — remove{% else %}Add experience{% endif %}
        </span>
    </label>
</article>
